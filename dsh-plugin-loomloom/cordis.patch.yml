# Inserted by `dsh plugin add dsh-plugin-loomloom`. The bundle has both Host
# and Web Client faces; DSH discovers the latter from package metadata. The
# authorization seam is a Host provider, not part of the standard Web roster,
# so this bundle owns the provider row required by its browser/token flow.
- insert:
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: loomloom
      name: dsh-plugin-loomloom
      config:
        # The market presents one creator's own catalogue, derived on every refresh
        # from `GET /creators/me/marketListings`. Name the environment variable that
        # holds that creator's credential; export it where the app is launched.
        # If it is missing the storefront stays empty and reports why, rather than
        # silently falling back to a stale pinned list.
        #
        # Alternatively, pin a fixed set instead:
        #   storefrontListingIds: [<listing id>, ...]
        # with an optional `LOOMLOOM_STOREFRONT_IDS` (comma-separated) override.
        creatorKeyEnv: LOOMLOOM_CREATOR_KEY
