# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- id: llm-pi-ai
  config:
    providers:
      shengsuanyun:
        displayName: 胜算云
        apiKeyEnv: SHENGSUANYUN_API_KEY
        api: openai-completions
        baseURL: https://router.shengsuanyun.com/api/v1
        models:
          - id: deepseek/deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 128000
            maxTokens: 32768

- id: agent-default-model
  config:
    provider: shengsuanyun
    model: deepseek/deepseek-v4-flash

- insert:
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: loomloom
      name: dsh-plugin-loomloom
      config:
        # The market is this creator's own catalogue, derived on every refresh from
        # `GET /creators/me/marketListings` with the credential this variable names.
        # A newly published SkillBot therefore appears with no maintenance.
        #
        # The variable is read from the process environment at startup, so it must
        # be exported where the app is launched, e.g.
        #   LOOMLOOM_CREATOR_KEY=<creator key> corepack yarn dev
        # If it is missing the storefront stays empty and says so, rather than
        # silently falling back to a stale pinned list.
        #
        # Only `status: published` + `saleStatus: listed` entries are taken: the
        # public detail route answers 404 for anything unlisted, so a draft or
        # withdrawn SkillBot could only ever render as "no longer listed". The
        # credential is used solely for discovery; every listing detail read is
        # anonymous.
        creatorKeyEnv: LOOMLOOM_CREATOR_KEY
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
